name = "zoo-cloud-edge"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# api.zoo.cloud already resolves to Cloudflare; this claims the hostname so the
# 525 becomes a real answer rather than a reach for an origin that is gone.
routes = [{ pattern = "api.zoo.cloud/*", custom_domain = true }]

# 20 requests a minute per address, counted across the edge rather than per
# process — the ceiling the Fastify version could only approximate.
[[unsafe.bindings]]
name = "BUDGET"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
